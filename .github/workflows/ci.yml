name: T3MP3ST CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Build and publish image (non-tag dispatches publish latest + sha)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: t3mp3st-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Pull request gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run PR correctness gate
        run: npm run test:pr
      - name: Resolve comparison base
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          coverage_base="$EVENT_BASE"
          if ! git rev-parse --verify "${coverage_base}^{commit}" >/dev/null 2>&1; then
            coverage_base="$(git rev-parse HEAD^)"
          fi
          echo "COVERAGE_BASE=$coverage_base" >> "$GITHUB_ENV"
      - name: Enforce 50% changed-line coverage floor
        env:
          PR_CHANGED_LINE_COVERAGE: "50"
        run: npm run test:pr-coverage
      - name: Verify changed-line coverage policy tool
        run: npm run test:changed-coverage-script

  release:
    name: Release certification and ZIP archive
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run release-grade test and evidence gates
        run: npm run test:release
      - name: Reject dependency vulnerabilities
        run: npm audit --audit-level=low
      - name: Build deterministic source ZIP from tested tag
        run: |
          mkdir -p release release-evidence
          archive="release/T3MP3ST-${GITHUB_SHA}.zip"
          git archive --format=zip --prefix="T3MP3ST-${GITHUB_SHA}/" --output="$archive" "$GITHUB_SHA"
          unzip -t "$archive" | tee release-evidence/source-zip-check.txt
          sha256sum "$archive" | tee release-evidence/SHA256SUMS
      - name: Verify a clean user build from the ZIP
        run: |
          install_root="$RUNNER_TEMP/t3mp3st-release-smoke"
          mkdir -p "$install_root"
          unzip -q "release/T3MP3ST-${GITHUB_SHA}.zip" -d "$install_root"
          cd "$install_root/T3MP3ST-${GITHUB_SHA}"
          npm ci
          npm run build
          node dist/cli.js --help > /dev/null
      - name: Attest tested ZIP provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-evidence/SHA256SUMS
      - name: Retain provenance bundle and verify archive checksum
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" release-evidence/slsa-provenance.sigstore.json
          sha256sum -c release-evidence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-source-zip-${{ github.sha }}
          path: |
            release/
            release-evidence/
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: Docker image build gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute image tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "primary=$image:ci" >> "$GITHUB_OUTPUT"
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.primary }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the built image
        run: |
          set -e
          docker run -d --name t3mp3st-smoke -e T3MP3ST_PORT=3333 -p 3333:3333 "${{ steps.meta.outputs.primary }}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3333/api/health > /dev/null 2>&1; then
              echo "health endpoint OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::image smoke test failed: /api/health did not come up"
          docker logs t3mp3st-smoke
          exit 1

  docker:
    name: Build and publish container image
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      (needs.test.result == 'success' || needs.release.result == 'success')
    needs: [test, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$image:${GITHUB_REF#refs/tags/},$image:latest"
            primary="$image:${GITHUB_REF#refs/tags/}"
          else
            tags="$image:latest,$image:sha-${GITHUB_SHA::7}"
            primary="$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the built image
        run: |
          set -e
          docker run -d --name t3mp3st-smoke -e T3MP3ST_PORT=3333 -p 3333:3333 "${{ steps.meta.outputs.primary }}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3333/api/health > /dev/null 2>&1; then
              echo "health endpoint OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::image smoke test failed: /api/health did not come up"
          docker logs t3mp3st-smoke
          exit 1
      - name: Push image tags
        run: |
          set -e
          IFS=',' read -ra tag_array <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${tag_array[@]}"; do
            docker push "$tag"
          done
